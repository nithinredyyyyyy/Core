name: CI
on:
  # Every push to main is a production gate.
  push:
    branches: [main]
  # Run on every pull request regardless of base branch. Stacked PRs (e.g. a
  # persistence change based on a hardening branch) must be verified too; keying
  # the trigger to a branch name silently skipped them. Required checks are
  # configured on the protected branch, not here.
  pull_request:

# Least privilege by default; jobs opt in to anything extra they need.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so a fast push does not race an
# older, stale run to the finish line.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action annotates the PR it is scanning; it needs to write here.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit (high and above)
        run: npm run audit:high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests (unit + integration)
        run: npm run test
