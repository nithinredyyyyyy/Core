services:
  - type: web
    name: core-esports
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CORE_AUTH_SESSION_SECRET
        generateValue: true
      - key: CORE_ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
